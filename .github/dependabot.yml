version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 6+ is blocked on tsup, not on our tsconfig. tsup's dts
      # build injects `baseUrl: compilerOptions.baseUrl || "."`
      # (tsup/dist/rollup.js), and TS 6.0 turned `baseUrl` from a deprecation
      # into a hard error (TS5101), so `npm run -w @azex/ledger-react build`
      # fails on any TS >= 6 (2026-09-07, PR #32). tsup 8.5.1 is latest and
      # has not shipped since 2025-11, so this will not resolve upstream on
      # its own -- moving off TS 5.x means replacing the dts path (tsup
      # `dts: false` + a separate `tsc --emitDeclarationOnly`).
      # TypeScript 7 (the Go-native compiler) is a further, separate decision:
      # typescript-eslint has no TS 7 support planned before 7.1 and
      # `next build`'s type check needs an experimental flag.
      - dependency-name: typescript
        versions: [">=6.0.0"]
      # eslint 10: eslint-config-next only requires >=9; move the lint
      # runtime on its own, not inside the weekly group.
      - dependency-name: eslint
        versions: [">=10.0.0"]
      # next pins postcss exactly; any range above that pin in
      # @azex/ledger-react installs a second, nested postcss whose types no
      # longer unify with the root copy and breaks `typecheck`
      # (scripts/build-css.ts). The package's range stays ^8 and follows
      # next's pin; do not propose a narrower one.
      - dependency-name: postcss

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
