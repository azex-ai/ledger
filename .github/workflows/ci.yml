name: CI
on: [push, pull_request]

jobs:
  verify:
    # The full Go verify gate lives in go-verify.yml (F-M6, 2026-09-02
    # audit) so this workflow and go-release.yml's tag-triggered verify
    # cannot drift apart the way go-release.yml drifted from this one
    # before: both `uses` the same file, so a step added to one reaches
    # both without a second copy-paste.
    uses: ./.github/workflows/go-verify.yml
