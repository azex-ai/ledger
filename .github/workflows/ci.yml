name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          # check-latest: runner manifests lag new patch releases; vulncheck
          # fails on stdlib CVEs already fixed in the newest patch without it.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ledger_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          # check-latest: runner manifests lag new patch releases; vulncheck
          # fails on stdlib CVEs already fixed in the newest patch without it.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - run: go test -race -timeout 5m -count=1 ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/ledger_test?sslmode=disable

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          # check-latest: runner manifests lag new patch releases; vulncheck
          # fails on stdlib CVEs already fixed in the newest patch without it.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  sqlc-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - name: sqlc diff
        working-directory: postgres
        run: sqlc diff

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          # check-latest: runner manifests lag new patch releases; vulncheck
          # fails on stdlib CVEs already fixed in the newest patch without it.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum
      - run: go build ./...
