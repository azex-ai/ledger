        require_verified_balance:
          type: boolean
          description: >-
            When true, Reserve refuses (422 / 14010, or 14011 for an
            unrecognized signing key) unless every balance_role=available
            classification this holder has touched in currency_uid passes the
            tamper-evident authorization check. It is ALSO a stricter amount
            check, not merely an extra one: a gated reservation is sized from
            an entries-only recompute of the available base rather than from
            balance_checkpoints, so an inflated checkpoint cannot raise what
            it will lock. Insufficiency under that recomputed base answers
            14001, not 14010. Off by default; the mechanism lives in the
            library and the policy of when to require it is the caller's
            (core.ReserveInput's doc comment, INVARIANTS I-32 / I-49).
    Reservation:
