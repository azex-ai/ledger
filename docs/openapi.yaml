        account_holder: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        from_status: { type: string }
        to_status: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        settled_amount: { $ref: "#/components/schemas/Decimal" }
        journal_uid:
          type: string
          format: uuid
          description: Absent from the wire until a journal is linked to the event.
        metadata:
          type: object
          description: Free-form string tags; values are strings, never nested JSON.
          additionalProperties: { type: string }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        actor_id: { type: integer, format: int64 }
        source: { type: string }

    Event:
      type: object
      description: >-
        journal_uid is the only genuinely optional field here
        (eventResponse.go: `omitempty` — absent from the wire, not
