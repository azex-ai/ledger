  /webhooks/{channel}:
    post:
      tags: [Webhooks]
      summary: Inbound channel callback (e.g. on-chain deposit).
      description: >-
        Body shape and signing are channel-specific. Hot path is
        HMAC-verified. The `evm` channel understands a deposit-sighting
        shape ({chain_id, tx_hash, txlog_seq, token, from, to, amount,
        confirmations, block_number}) and routes it to the same
        IngestDeposit orchestration the chains/evm watcher uses -- see
        docs/plans/2026-07-11-crypto-deposit-sweep-design.md §3.
        `block_number` is required and must be a positive integer (the
        block the transfer log was mined in) -- the confirmation-threshold
        recheck loop is computed from it, so a missing or zero value is
        rejected rather than silently treated as an unconfirmable deposit
        (core.DepositSighting.Validate). Answers FeatureNotEnabled (503)
        unless the crypto-deposit add-on is wired in, and answers 200 with a
        `{status: "ignored"}` no-op body (not an error) when the sighting
        has nothing to book -- unregistered address, non-whitelisted token,
        or an unconfigured chain. Other channels use the legacy shape
        ({tx_hash, booking_uid, amount, confirmations, status}) that
        transitions a pre-existing booking_uid, confined to
        deposit-classification bookings only (design doc §5-5).
      security: []
      parameters:
        - in: path
          name: channel
          required: true
          schema: { type: string, enum: [evm, btc, custom] }
      responses:
        "200":
          description: 'Accepted -- returns the ingested booking (evm sighting path), a `{status: "ignored"}` no-op body (evm sighting path with nothing to book), or the transition event (legacy path). Three distinct Go response types (bookingToResponse / eventToResponse / depositSightingIgnoredResponse in server/handler_webhooks.go) share this one operation, hence oneOf rather than a single $ref -- deliberately inline, not a named component, so it stays outside the by-name completeness registry the same way an inline requestBody schema does (see server/openapi_contract_test.go).'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BookingEnvelope"
                  - $ref: "#/components/schemas/EventEnvelope"
                  - allOf:
                      - $ref: "#/components/schemas/Envelope"
                      - type: object
                        properties:
                          data:
                            type: object
                            required: [status]
                            properties:
                              status: { type: string, enum: [ignored] }
        "401": { description: HMAC verification failed. }
        "403":
          description: >-
            Three structural refusals on the legacy booking_uid path; a valid
            signature is necessary and never sufficient. (1) The booking's
            channel_name is not {channel}. (2) Its classification is not the
            deposit classification -- this is what keeps a callback from ever
            transitioning a sweep booking, which posts no journal and so would
            leave a forged "confirmed" with no accounting trace (design doc
            §5-5). (3) status is "confirmed": confirming a deposit posts
            accounting, and INVARIANTS I-21 holds that the journal comes from
            exactly one place, the service-layer orchestration that writes it
            in the same transaction as the transition. This path posts nothing,
            so a "confirmed" here would produce a settled-looking deposit with
            no entries behind it. Implement channel.SightingParser to ingest a
            confirmation; the server routes a sighting-capable adapter to the
            deposit-ingestion path automatically. Any other lifecycle status is
            accepted normally.
        "409":
          description: >-
            In-window replay, rejected by the inbound nonce cache. The cache is
            host-wired, not automatic -- `srv.SetWebhookNonceRecorder(
            svc.WebhookNonceRecorder())` at assembly time. Until that call is
            made there is no in-window replay protection and this response
            cannot occur; the library ships the implementation
            (postgres.WebhookSubscriberStore.TryRecordNonce) but installs
            nothing by default, because an inbound channel that is not exposed
            does not need one.
        "503": { description: Crypto-deposit add-on not enabled on this server (evm sighting path only). }

