          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileReportEnvelope" }

  /snapshots:
    get:
      x-required-scope: read
      tags: [Reconciliation]
      summary: List balance snapshots for an account dimension.
      parameters:
        - in: query
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: start
          required: true
          schema: { type: string, format: date }
        - in: query
          name: end
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: >-
            Snapshots. server/handler_system.go's handleListSnapshots
            returns a function-local `snapshotResp` struct, not a named
            package-level type -- inline here rather than a $ref'd
            component, same reasoning as POST /balances/batch above.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, next_cursor]
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              required: [account_holder, currency_uid, classification_uid, snapshot_date, balance]
                              properties:
                                account_holder: { type: integer, format: int64 }
                                currency_uid: { type: string, format: uuid }
                                classification_uid: { type: string, format: uuid }
                                snapshot_date: { type: string, format: date }
                                balance: { $ref: "#/components/schemas/Decimal" }
                          next_cursor:
                            type: [string, "null"]
                            description: Always null -- this endpoint returns its full result set (not paginated).

  /audit/journals:
    get:
      x-required-scope: read
      tags: [Audit]
      summary: List journals by account dimension or by global time range.
      description: |
        Exactly one mode is selected by the params provided: pass `holder` +
        `currency_uid` (optionally narrowed by `classification_uid` and/or
        `from`/`to`) to list journals touching that account dimension; pass
        `from`/`to` alone to scan a global time range instead. Providing
        neither, or `holder` without `currency_uid`, is a 400.

        Both modes are cursor-paginated **newest first** (H-m3), the same
        direction as GET /journals and GET /holder/transactions.
      parameters:
        - in: query
          name: holder
          schema: { type: integer, format: int64 }
        - in: query
          name: currency_uid
          schema: { type: string, format: uuid }
        - in: query
          name: classification_uid
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { $ref: "#/components/schemas/Timestamp" }
        - in: query
          name: to
          schema: { $ref: "#/components/schemas/Timestamp" }
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Journals page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalListEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"
  /audit/bookings/{uid}/trace:
    get:
      x-required-scope: read
      tags: [Audit]
      summary: Trace a booking end-to-end (booking + every event + every linked journal).
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Booking trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingTraceEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
  /audit/journals/{uid}/reversals:
    get:
      x-required-scope: read
      tags: [Audit]
      summary: List the reversal chain for a journal (root journal + every journal that transitively reverses it).
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reversal chain, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalListEnvelope" }

  /platform/balances:
    get:
      x-required-scope: read
      tags: [Platform]
      summary: Real-time per-classification balance breakdown for a currency.
      description: |
        Computed as `checkpoint.balance + delta`, so it reflects every
        committed journal immediately without waiting for the rollup worker.
      parameters:
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Platform balance breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformBalanceEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"
  /platform/solvency:
    get:
      x-required-scope: read
      tags: [Platform]
      summary: Compare total user-side liability against custodial system balance for a currency.
      parameters:
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Solvency report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolvencyEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"

  /balances/trends:
    get:
      x-required-scope: read
      tags: [Trends]
      summary: Historical daily balance series for an account dimension.
      description: |
        One point per calendar day in `[from, to]`. Days without journal
        activity are forward-filled from the previous known balance;
        today's point is always the live checkpoint+delta value.
      parameters:
        - in: query
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: classification_uid
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          schema: { $ref: "#/components/schemas/Timestamp" }
        - in: query
          name: to
          required: true
          schema: { $ref: "#/components/schemas/Timestamp" }
      responses:
        "200":
          description: Balance trend points, ascending by date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceTrendListEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"


  /holder-tokens:
    post:
      x-required-scope: write
      tags: [Holder]
      summary: Mint a holder-scoped read token (host backend, write scope).
      description: >
        Mints a short-lived, read-only token bound to ONE account holder
        (lht_ prefix on the shared bearer header). The host backend calls
        this after its own session auth and hands the token to its frontend;
        the token then authenticates the /holder/* read surface. Leak blast
        radius: one holder, read-only, until exp. TTL defaults to 15m and is
        capped server-side (default 1h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder]
              properties:
                holder: { type: integer, format: int64 }
                ttl_seconds: { type: integer, format: int64, description: "Optional; capped by the server." }
      responses:
        "200":
          description: Minted token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolderTokenEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"
  /holder/balances:
    get:
      tags: [Holder]
      summary: The token-bound holder's balances, one row per currency.
      security:
        - holderToken: []
      parameters:
        - in: query
          name: currency_uid
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Balance breakdown per currency (total = available + pending + locked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolderBalanceListEnvelope" }
  /holder/transactions:
    get:
      tags: [Holder]
      summary: The token-bound holder's translated transaction view.
      description: >
        One row per (journal, currency) net effect on the holder, newest
        first, in user language (kind/kind_label/direction/amount) — no
        double-entry vocabulary. Cursor-paginated at journal granularity.
      security:
        - holderToken: []
      parameters:
        - in: query
          name: cursor
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32, maximum: 100 }
      responses:
        "200":
          description: Transaction page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolderTransactionListEnvelope" }
  /holder/holds:
    get:
      tags: [Holder]
      summary: The token-bound holder's outstanding holds (cursor-paginated, newest first).
      description: >-
        Cursor-paginated since H-m9: this endpoint used to return the
        holder's entire hold set with no limit, an unbounded body from an
        unbounded scan. Same cursor shape and direction as
        GET /holder/transactions.
      security:
        - holderToken: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, format: int32, default: 20, maximum: 100 }
      responses:
        "200":
          description: Active holds (locked amounts with expiry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HolderHoldListEnvelope" }
  /holder/deposit-address:
    get:
      tags: [Holder, Crypto Deposit]
      summary: Look up the token-bound holder's already-registered deposit address.
      description: >-
        Holder-scoped mirror of GET /holders/{holder}/deposit-address --
        same DepositAddressProvider, but the holder comes exclusively from
        the holder token, never a request parameter. Does not create one --
        404s if the holder has none yet. Answers FeatureNotEnabled (503)
        unless the crypto-deposit add-on is wired in.
      security:
        - holderToken: []
      responses:
        "200":
          description: Deposit address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddressEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }
    post:
      tags: [Holder, Crypto Deposit]
      summary: Issue (idempotently) the token-bound holder's CREATE2 deposit address.
      description: >-
        Holder-scoped mirror of POST /holders/{holder}/deposit-address --
        derives and registers the address on first call, repeated calls
        return the same address. The holder is bound to the token; the route
        moves no funds, it only provisions the caller's own receiving
        address. Answers FeatureNotEnabled (503) unless the crypto-deposit
        add-on is wired in.
      security:
        - holderToken: []
      responses:
        "201":
          description: Deposit address (created on first call, or already registered).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddressEnvelope" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }

  /dev/credits:
    post:
      x-required-scope: admin
      tags: [Developer]
      summary: Credit a holder with no custodied asset behind it (developer mode).
      description: >-
        Simulates a deposit: posts the `dev_credit` template
        (DR main_wallet holder / CR dev_credit system counterpart), so the
        credited funds land in the holder's available balance and can drive
        real downstream flows. Disabled by default and answers
        FeatureNotEnabled (503) unless DEV_CREDIT_ENABLED=true, which the
        server only accepts when ENV=dev -- boot fails otherwise.


        The resulting journal is an ordinary journal: append-only, corrected
        only through POST /journals/{uid}/reverse. Because its system leg is
        `dev_credit` rather than `custodial`, GET /platform/solvency counts
        the new liability with no offsetting asset and reports the shortfall
        -- by design. The shortfall equals the `dev_credit` account balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_id, currency_uid, amount, idempotency_key]
              properties:
                holder_id: { type: integer, format: int64 }
                currency_uid: { type: string, format: uuid }
                amount:
                  $ref: "#/components/schemas/Decimal"
                idempotency_key: { type: string }
                actor_id: { type: integer, format: int64 }
                source: { type: string }
                metadata:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Journal created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"
        "503": { description: Developer credit not enabled on this server. }

  /periods/close:
    post:
      x-required-scope: admin
      tags: [Periods]
      summary: Close an accounting period (hard write barrier before close_before).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClosePeriodRequest" }
      responses:
        "201":
          description: Period close recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodCloseEnvelope" }
        "409":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"
  /periods/closes:
    get:
      x-required-scope: read
      tags: [Periods]
      summary: List period closes (most recent first).
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Period closes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodCloseListEnvelope" }
  /reports/trial-balance:
    get:
      x-required-scope: read
      tags: [Reports]
      summary: Trial balance for one currency as of a point in time.
      parameters:
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: as_of
          schema: { type: string, format: date-time, description: "RFC3339; defaults to now when omitted." }
      responses:
        "200":
          description: Trial balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialBalanceEnvelope" }
        "400":
          $ref: "#/components/responses/DomainError"

components:
  securitySchemes:
    holderToken:
      type: http
      scheme: bearer
      bearerFormat: Holder token
      description: >
        Stateless HMAC-signed token minted via POST /holder-tokens (or
        in-process by an embedding host), lht_ prefix, bound to one account
        holder, read-only. Shares the Authorization header with API keys;
        the server disambiguates by prefix.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Keys are configured server-side as name:scope:secret triples; the
        bearer token is the secret. Scopes are ordered read < write < admin:
        read covers the query surface (plus POST /balances/batch and template
        preview), write adds journals/reversals/reservations/bookings, admin
        adds configuration mutations, account policies, reconcile triggers,
        and period close. Insufficient scope yields business code 10150
        (HTTP 403). A key may also carry independent capabilities, joined
        onto the scope with '+' (e.g. read+deposit_review) -- these are not
        implied by any scope, not even admin. deposit_review is required by
        POST /deposits/{uid}/review/approve and /reject, independent of the
        write scope that already covers deposit ingestion (self-approval
        prevention).

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DomainError:
      description: Ledger / domain invariant violation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Decimal:
      type: string
      description: 'Arbitrary-precision decimal as a string (e.g. 123.456789). NUMERIC(30,18) on the wire.'
      example: "100.00"
    Timestamp:
      type: string
      format: date-time
      example: "2026-04-29T10:00:00Z"

    HolderTokenEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [token, expires_at]
              properties:
                token: { type: string, example: "lht_eyJob2xkZXIiOjQyfQ.c2ln" }
                expires_at: { $ref: "#/components/schemas/Timestamp" }

    HolderBalance:
      type: object
      required: [currency_uid, currency_code, available, pending, locked, total]
      properties:
        currency_uid: { type: string, format: uuid }
        currency_code: { type: string, example: "USD" }
        available: { $ref: "#/components/schemas/Decimal" }
        pending: { $ref: "#/components/schemas/Decimal" }
        locked: { $ref: "#/components/schemas/Decimal" }
        total: { $ref: "#/components/schemas/Decimal", description: "= available + pending + locked" }
    HolderBalanceListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/HolderBalance" }
                next_cursor:
                  type: [string, "null"]
                  description: >-
                    Always null: this endpoint returns its full result set.
                    Present so every list envelope in this API carries the
                    same comparable sentinel (api-contract.md §6).

    HolderTransaction:
      type: object
      required: [uid, kind, kind_label, direction, amount, currency_uid, currency_code, occurred_at, reversal_of_uid, memo]
      properties:
        uid: { type: string, format: uuid, description: "Journal uid — trace anchor, safe to display." }
        kind: { type: string, enum: [deposit, withdrawal, transfer, fee, adjustment, other], example: "deposit", description: "Small, deployment-stable product vocabulary (core.HolderTxKind, M-7 fix, docs/INVARIANTS.md I-44) a host app can hardcode a label-override map against. Never the ledger's internal journal-type code or uid (see kind_label for the display text)." }
        kind_label: { type: string, example: "Deposit", description: "Library-side default display label." }
        direction: { type: string, enum: [in, out] }
        amount: { $ref: "#/components/schemas/Decimal", description: "Absolute net amount for this (journal, currency)." }
        currency_uid: { type: string, format: uuid }
        currency_code: { type: string, example: "USD" }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        reversal_of_uid: { type: string, description: "Non-empty when this row is a reversal of that journal." }
        memo: { type: string, description: "journal.metadata[\"memo\"] — host-written user-readable copy; empty when absent." }
    HolderTransactionListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/HolderTransaction" }
                next_cursor: { type: [string, "null"], description: "Null when exhausted." }

    HolderHold:
      type: object
      required: [uid, amount, currency_uid, currency_code, created_at, expires_at]
      properties:
        uid: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Decimal", description: "Outstanding hold (unsettled remainder while settling)." }
        currency_uid: { type: string, format: uuid }
        currency_code: { type: string, example: "USD" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    HolderHoldListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/HolderHold" }
                next_cursor:
                  type: [string, "null"]
                  description: >-
                    Opaque cursor for the next (older) page; null when
                    exhausted (api-contract.md §6).

    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 200, description: "200 on success; business error code otherwise" }
        message:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ErrorMessage"
        data: {}

    ErrorMessage:
      type: object
      required: [text]
      properties:
        text: { type: string, example: "Insufficient balance for this operation" }
        fields:
          type: object
          additionalProperties: { type: string }

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code: { type: integer, example: 14001 }
            message: { $ref: "#/components/schemas/ErrorMessage" }
            data: { type: "null" }

    EntryType:
      type: string
      enum: [debit, credit]
    NormalSide:
      type: string
      enum: [debit, credit]
    HolderRole:
      type: string
      enum: [user, system]
    BalanceRole:
      type: string
      description: >-
        Semantic liquidity tag for a classification's balance in the
        holder-facing breakdown. "" excludes the classification from that
        view -- valid for is_system classifications, but refused by the
        server for a non-system classification (M-4 fix, docs/INVARIANTS.md
        I-37 addendum): a non-system classification must declare either a
        spendable bucket (available/pending/locked) or "memo" (a deliberate
        non-liability memo/cost account, e.g. per-user fee tracking)
        explicitly.
      enum: ["", available, pending, locked, memo]

    EntryInput:
      type: object
      required: [account_holder, currency_uid, classification_uid, entry_type, amount]
      properties:
        account_holder: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        classification_uid: { type: string, format: uuid }
        entry_type: { $ref: "#/components/schemas/EntryType" }
        amount:     { $ref: "#/components/schemas/Decimal" }

    JournalInput:
      type: object
      required: [journal_type_uid, idempotency_key, entries]
      properties:
        journal_type_uid: { type: string, format: uuid }
        idempotency_key: { type: string }
        event_uid: { type: string, format: uuid }
        entries:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EntryInput" }
        metadata:
          type: object
          additionalProperties: { type: string }
        actor_id: { type: integer, format: int64 }
        source:   { type: string }
        effective_at: { $ref: "#/components/schemas/Timestamp", description: "Business time; defaults to now and may not be more than five minutes in the future." }

    Journal:
      type: object
      required: [uid, journal_type_uid, idempotency_key, total_debit, total_credit, metadata, actor_id, source, effective_at, created_at]
      properties:
        uid: { type: string, format: uuid }
        journal_type_uid: { type: string, format: uuid }
        idempotency_key: { type: string }
        total_debit:  { $ref: "#/components/schemas/Decimal" }
        total_credit: { $ref: "#/components/schemas/Decimal" }
        metadata:
          type: object
          additionalProperties: { type: string }
        actor_id:    { type: integer, format: int64 }
        source:      { type: string }
        reversal_of_uid: { type: string, format: uuid, description: "Empty when this journal is not a reversal." }
        event_uid:   { type: string, format: uuid, description: "Empty when not event-driven." }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        created_at:  { $ref: "#/components/schemas/Timestamp" }
    Entry:
      type: object
      description: >-
        Entries are not individually uid'd -- core.Entry has no uid field.
        An entry is identified by its (journal_uid, account_holder,
        currency_uid, classification_uid) tuple; its internal BIGSERIAL row
        id is never exposed (I-18).
      required: [journal_uid, account_holder, currency_uid, classification_uid, entry_type, amount, effective_at, created_at]
      properties:
        journal_uid: { type: string, format: uuid }
        account_holder: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        classification_uid: { type: string, format: uuid }
        entry_type: { $ref: "#/components/schemas/EntryType" }
        amount:     { $ref: "#/components/schemas/Decimal" }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    EntryListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/Entry" }
                next_cursor:
                  type: [string, "null"]
                  description: Opaque cursor; null when exhausted.

    JournalEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
