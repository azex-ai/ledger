        name: { type: string }
        is_active: { type: boolean }
        holder_kind: { type: string, enum: ["", deposit, withdrawal, transfer, fee, adjustment, other], description: "'' when untagged (M-7 fix, docs/INVARIANTS.md I-44)." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    JournalTypeEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/JournalType" }
    JournalTypeListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/JournalType" }
                next_cursor:
                  type: [string, "null"]
                  description: Always null -- this endpoint returns its full result set (not paginated).

    TemplateLineInput:
      type: object
      required: [classification_uid, entry_type, holder_role, amount_key]
      properties:
        classification_uid: { type: string, format: uuid }
        entry_type: { $ref: "#/components/schemas/EntryType" }
        holder_role: { $ref: "#/components/schemas/HolderRole" }
        amount_key: { type: string }
        sort_order: { type: integer }
    TemplateInput:
      type: object
      required: [code, name, journal_type_uid, lines]
      properties:
        code: { type: string }
        name: { type: string }
        journal_type_uid: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TemplateLineInput" }
    TemplateLine:
      type: object
      required: [classification_uid, entry_type, holder_role, amount_key, sort_order]
      properties:
        classification_uid: { type: string, format: uuid }
        entry_type: { $ref: "#/components/schemas/EntryType" }
        holder_role: { $ref: "#/components/schemas/HolderRole" }
        amount_key: { type: string }
        sort_order: { type: integer }
    Template:
      type: object
      required: [uid, code, name, journal_type_uid, is_active, lines, created_at]
      properties:
        uid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        journal_type_uid: { type: string, format: uuid }
        is_active: { type: boolean }
        lines:
          type: array
          items: { $ref: "#/components/schemas/TemplateLine" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TemplateEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Template" }
    TemplateListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/Template" }
                next_cursor:
                  type: [string, "null"]
                  description: Always null -- this endpoint returns its full result set (not paginated).

    Currency:
      type: object
      required: [uid, code, name, is_active, exponent]
      properties:
        uid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        exponent: { type: integer, minimum: 0, maximum: 18 }
    CurrencyEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Currency" }
    CurrencyListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/Currency" }
                next_cursor:
                  type: [string, "null"]
                  description: Always null -- this endpoint returns its full result set (not paginated).

    TemplateParams:
      type: object
      required: [holder_id, currency_uid, idempotency_key, amounts]
      properties:
        holder_id: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        idempotency_key: { type: string }
        event_uid: { type: string, format: uuid }
        amounts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        actor_id: { type: integer, format: int64 }
        source: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
    TemplatePreviewRequest:
      type: object
      description: >-
        Deliberately narrower than TemplateParams / TemplateExecutionRequest:
        POST /templates/{code}/preview never posts anything (it hardcodes
        idempotency_key="preview" server-side and does not call
        JournalWriter), so it takes no idempotency_key, event_uid, actor_id,
        source, or metadata.
      required: [holder_id, currency_uid, amounts]
      properties:
        holder_id: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        amounts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    PreviewEntry:
      type: object
      required: [account_holder, currency_uid, classification_uid, entry_type, amount]
      properties:
        account_holder: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        classification_uid: { type: string, format: uuid }
        entry_type: { $ref: "#/components/schemas/EntryType" }
        amount: { $ref: "#/components/schemas/Decimal" }
    TemplatePreviewResult:
      type: object
      description: >-
        The rendered core.JournalInput a matching POST /journals/template
        call would post -- unposted, hence "entries" rather than a full
        Journal (no uid/created_at/etc exist yet).
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/PreviewEntry" }
    TemplatePreviewResultEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/TemplatePreviewResult" }
    TemplateExecutionRequest:
      type: object
      required: [template_code, holder_id, currency_uid, idempotency_key, amounts]
      properties:
        template_code: { type: string }
        holder_id: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        idempotency_key: { type: string }
        event_uid: { type: string, format: uuid }
        amounts:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        actor_id: { type: integer, format: int64 }
        source: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }

    DepositToleranceRequest:
      type: object
      required: [holder_id, currency_uid, idempotency_key, expected_amount, actual_amount, tolerance]
      properties:
        holder_id: { type: integer, format: int64 }
        currency_uid: { type: string, format: uuid }
        idempotency_key: { type: string }
        expected_amount: { $ref: "#/components/schemas/Decimal" }
        actual_amount:   { $ref: "#/components/schemas/Decimal" }
        tolerance:       { $ref: "#/components/schemas/Decimal" }
        actor_id: { type: integer, format: int64 }
        source:   { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
    DepositTolerancePlanResult:
      type: object
      required: [outcome, expected_amount, actual_amount, tolerance, delta, requires_manual_review, journals]
      properties:
        outcome:
          type: string
          enum: [exact_match, shortfall_auto_released, shortfall_pending_review, overage_auto_credited, overage_recorded_for_review]
        expected_amount: { $ref: "#/components/schemas/Decimal" }
        actual_amount:   { $ref: "#/components/schemas/Decimal" }
        tolerance:       { $ref: "#/components/schemas/Decimal" }
        delta:           { $ref: "#/components/schemas/Decimal" }
        requires_manual_review: { type: boolean }
        journals:
          type: array
          items: { $ref: "#/components/schemas/Journal" }
    DepositToleranceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/DepositTolerancePlanResult" }

    ReconcileResult:
      type: object
      description: >-
        handleReconcileGlobal/handleReconcileAccount (Go) have no omitempty
        anywhere in this struct or its nested detail rows -- details is
        always a real (possibly empty) array, never absent.
      required: [balanced, gap, details, checked_at]
      properties:
        balanced: { type: boolean }
        gap: { $ref: "#/components/schemas/Decimal" }
        details:
          type: array
          items:
            type: object
            required: [account_holder, currency_uid, classification_uid, expected, actual, drift]
            properties:
              account_holder: { type: integer, format: int64 }
              currency_uid: { type: string, format: uuid }
              classification_uid: { type: string, format: uuid }
              expected: { $ref: "#/components/schemas/Decimal" }
              actual:   { $ref: "#/components/schemas/Decimal" }
              drift:    { $ref: "#/components/schemas/Decimal" }
        checked_at: { $ref: "#/components/schemas/Timestamp" }
    ReconcileEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ReconcileResult" }

    BookingTrace:
      type: object
      required: [booking, events, journals]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        journals:
          type: array
          items: { $ref: "#/components/schemas/Journal" }
    BookingTraceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/BookingTrace" }

    PlatformBalance:
      type: object
      required: [currency_uid, user_side, system_side]
      properties:
        currency_uid: { type: string, format: uuid }
        user_side:
          type: object
          description: classification code → total (holder > 0).
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
        system_side:
          type: object
          description: classification code → total (holder < 0).
          additionalProperties: { $ref: "#/components/schemas/Decimal" }
    PlatformBalanceEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PlatformBalance" }

    SolvencyReport:
      type: object
      required: [currency_uid, liability, custodial, solvent, margin]
      properties:
        currency_uid: { type: string, format: uuid }
        liability: { $ref: "#/components/schemas/Decimal" }
        custodial: { $ref: "#/components/schemas/Decimal" }
        solvent: { type: boolean }
        margin: { $ref: "#/components/schemas/Decimal", description: 'custodial - liability; negative = under-collateralised.' }
    SolvencyEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SolvencyReport" }

    BalanceTrendPoint:
      type: object
      required: [date, balance, inflow, outflow]
      properties:
        date: { type: string, format: date }
        balance: { $ref: "#/components/schemas/Decimal" }
        inflow: { $ref: "#/components/schemas/Decimal" }
        outflow: { $ref: "#/components/schemas/Decimal" }
    BalanceTrendListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [list, next_cursor]
              properties:
                list:
                  type: array
                  items: { $ref: "#/components/schemas/BalanceTrendPoint" }
                next_cursor:
                  type: [string, "null"]
                  description: Always null -- this endpoint returns its full result set (not paginated).

    ReconcileReport:
      type: object
      required: [checks, overall_passed, full_coverage, run_at]
      properties:
        overall_passed:
          type: boolean
          description: >-
            True when no check found a violation. Reports violations found, not
            coverage achieved — this alone is NOT a clean bill of health.
            Require overall_passed AND full_coverage for that.
        full_coverage:
          type: boolean
          description: >-
            True only when every check covered its full intended scope. False
            means at least one check was capped, timed out, or skipped, so the
            run cannot testify about what it never examined.
        run_at: { $ref: "#/components/schemas/Timestamp" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/ReconcileCheck" }
    ReconcileCheck:
      type: object
      required: [name, passed, complete, findings, checked_at]
      properties:
        name: { type: string, description: "e.g. orphan_entries, checkpoint_balance, accounting_equation, system_rollup_integrity, snapshot_integrity" }
        passed:
          type: boolean
          description: >-
            False if any finding was detected. Reports only on what the
            check actually examined — read together with `complete`.
        complete:
          type: boolean
          description: >-
            False when the check could not cover its full scope (capped
            or timed-out scan, or a check skipped outright). Partial
            coverage never reads as a pass.
        checked_at: { $ref: "#/components/schemas/Timestamp" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/ReconcileFinding" }
    ReconcileFinding:
      type: object
      required: [description]
      properties:
        description: { type: string }
        detail:
          type: string
          description: >-
            Optional structured context. Absent from the wire when the check
            recorded none (server's wire struct has `omitempty`).
    ReconcileReportEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ReconcileReport" }
