        source:   { type: string }
        idempotency_key:
          type: string
          description: >-
            Required (I-3). May instead be supplied via the Idempotency-Key
            header. A retried request with the same key and the same
            (to_status, channel_ref, amount) payload replays the original
            event, even after the booking has since moved on to a later
            status; the same key with a different payload is a conflict.
    Booking:
      type: object
      description: >-
        reservation_uid and journal_uid are the only genuinely optional
        fields here (bookingResponse.go: `omitempty` — the field is absent
        from the wire, not present-as-empty, until a reservation/journal is
        linked). Every other field is always populated.
      required: [uid, classification_uid, account_holder, currency_uid, amount, settled_amount, status, channel_name, channel_ref, idempotency_key, metadata, expires_at, created_at, updated_at]
      properties:
        uid: { type: string, format: uuid }
