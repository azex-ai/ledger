    DeadLetter:
      type: object
      required: [uid, chain_id, tx_hash, txlog_seq, idempotency_key, reason, booked, token, to, amount, created_at]
      properties:
        uid: { type: string, format: uuid }
        chain_id: { type: integer, format: int64 }
        tx_hash: { type: string }
        txlog_seq:
          type: integer
          description: >-
            The Transfer log's zero-based position among ALL logs in the
            transaction's receipt -- the same definition the booking
            idempotency key uses.
        idempotency_key:
          type: string
          description: "deposit-{chain_id}-{tx_hash}-{txlog_seq} -- the key the booking would have had."
        reason:
          type: string
          description: >-
            The rejection's error text as recorded. The BOUNDED
            classification an alert labels on is the `reason` label of
            ledger_deposit_ingest_dead_lettered_total, not this field.
        booked:
          type: boolean
          description: >-
            Whether a booking exists for this idempotency key now -- i.e.
            whether the deposit was credited after all (replayed, or the
            cause self-healed). Recomputed per read; true means no action is
            needed.
