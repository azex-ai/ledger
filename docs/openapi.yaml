  /deposits/dead-letters:
    get:
      x-required-scope: read
      tags: [Crypto Deposit]
      summary: List dead-lettered deposit sightings (transfers the ledger refused to book).
      description: >-
        A dead letter is a transfer that IS on chain, to a registered
        address, in a whitelisted token, that the ingestion path refused --
        an idempotency-key payload conflict, an unregistered currency, an
        amount the currency's exponent cannot represent -- after which the
        forward scan moved past it. No booking exists, so nothing else in the
        system will revisit it: this queue and
        POST /deposits/dead-letters/{uid}/replay are the only way back.
        Newest first, keyset paginated. `booked` is recomputed per read (a
        row whose deposit was credited in the end needs no action), so the
        queue clears itself. See docs/RUNBOOK.md section 18. Answers
        FeatureNotEnabled (503) unless the crypto-deposit add-on is wired in.
      parameters:
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Dead-letter queue page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadLetterListEnvelope" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }
  /deposits/dead-letters/{uid}/replay:
    post:
      x-required-capability: deposit_review
      tags: [Crypto Deposit]
      summary: Re-drive one dead-lettered sighting through the real ingestion path.
      description: >-
        For after the cause is fixed (a currency registered, an exponent
        corrected, a token added back to the allowlist). Runs the identical
        IngestDeposit path a watcher sighting would, review gate included, so
        it is idempotent -- a sighting already booked resolves to the same
        booking and posts nothing new -- and it can end in the same
        deposit_confirm journal an approval posts. Hence the deposit_review
        capability rather than write scope: the key that can forge a sighting
        must not also be able to push one back in. 400 when this ledger has
        nothing to book for that sighting (address not registered, or token
        not in the chain's allowlist) rather than reporting a no-op as
        success.
