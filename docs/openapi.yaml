openapi: 3.1.0
info:
  title: azex-ai/ledger HTTP API
  description: |
    Production-grade double-entry ledger service. Classification-driven
    architecture: deposit / withdrawal / transfer are preset configurations
    of a generic Booking lifecycle, not hardcoded types.

    `info.version` tracks the Go module's release tag (see CHANGELOG.md) —
    bump both together, not independently.

    Companion docs:
      - `docs/api.md`         — long-form prose
      - `docs/INVARIANTS.md`  — what the ledger guarantees
      - `docs/RUNBOOK.md`     — incident response
  version: "0.6.0"
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local dev
  - url: https://ledger.example.com/api/v1
    description: Production (your deployment)

security:
  - bearerAuth: []

tags:
  - name: System
    description: Health, readiness, system-wide rollups.
  - name: Journals
    description: Append-only double-entry records.
  - name: Balances
    description: Real-time balance reads (checkpoint + delta).
  - name: Reservations
    description: TOCTOU-safe budget locking for reserve/settle flows.
  - name: Bookings
    description: Classification-driven lifecycle records.
  - name: Events
    description: State-transition events emitted by booking transitions.
  - name: Webhooks
    description: Inbound channel callbacks (e.g. on-chain deposits).
  - name: Metadata
    description: Classifications, journal types, templates, currencies.
  - name: Reconciliation
    description: Accounting-equation checks and snapshots.
  - name: Audit
    description: Read-only investigation — journals by account/time, booking trace, reversal chains.
  - name: Platform
    description: Real-time platform-wide balance breakdown and solvency check.
  - name: Trends
    description: Historical daily balance time-series.
  - name: Developer
    description: >-
      Developer-mode facilities. Off by default and only permitted under
      ENV=dev; they create ledger state that no external event backs.

paths:
  /system/health:
    get:
      tags: [System]
      summary: Liveness probe (no auth)
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthEnvelope" }
        "503":
          description: DB unreachable. Envelope, same as every other error response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /system/ready:
    get:
      tags: [System]
      summary: Readiness probe — DB connectivity + worker status.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [ready] }
        "503":
          description: Not ready yet. Envelope, same as every other error response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /system/balances:
    get:
      x-required-scope: read
      tags: [System]
      summary: Aggregated system rollups.
      responses:
        "200":
          description: List of system rollups by classification × currency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemRollupsEnvelope" }

  /journals:
    get:
      x-required-scope: read
      tags: [Journals]
      summary: List journals (cursor-paginated, newest first).
      description: >-
        Ordered by internal id descending, so the first page is the most
        recent journals. `next_cursor` walks strictly older. The same
        direction as GET /entries, GET /audit/journals and
        GET /holder/transactions.
      parameters:
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Journals page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalListEnvelope" }
    post:
      x-required-scope: write
      tags: [Journals]
      summary: Post a balanced journal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalInput" }
      responses:
        "201":
          description: Journal created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEnvelope" }
        "403":
          description: An entry targets an is_system classification and AllowSystemClassificationPost is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"
  /journals/template:
    post:
      x-required-scope: write
      tags: [Journals]
      summary: Render a template into a journal and post it.
      description: >-
        Answers 403 for any template with a leg on an is_system
        classification -- derived from the template's own lines, so a
        deployment's own system-side template is covered without being
        named -- and for any template_code in the effective protected set:
        presets.ProtectedTemplateCodes() (deposit_confirm and its siblings,
        protected by default) plus Config.ProtectedTemplateCodes (a
        deployment's own additional system-only codes), minus
        Config.AllowGenericTemplatePost (an explicit per-code opt-out).
        Those codes are meant to be posted only by the deployment's own
        verified-deposit orchestration, never by naming the code directly
        through this generic endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateExecutionRequest" }
      responses:
        "201":
          description: Journal created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEnvelope" }
        "403":
          description: >-
            Refused: the template has a leg on an is_system classification
            (structurally derived from its own lines, whoever defined it), or
            template_code is in the effective protected set
            (presets.ProtectedTemplateCodes() plus
            Config.ProtectedTemplateCodes). ALLOW_GENERIC_TEMPLATE_POST is
            the single per-code opt-out for both rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          $ref: "#/components/responses/DomainError"
        "422":
          $ref: "#/components/responses/DomainError"
  /journals/deposit-tolerance:
    post:
      x-required-scope: admin
      tags: [Journals]
      summary: Resolve deposit shortfall / overage atomically (admin scope; 403 by default).
      description: >-
        ⚠️ Requires the **admin** scope, not write, and answers **403 under
        the default configuration** (contract §7.11).


        This endpoint takes no template_code, but it turns caller-supplied
        expected/actual amounts into executions of deposit_confirm_pending /
        deposit_confirm / deposit_release_pending / deposit_record_overage --
        the same deposit-shaped accounting POST /journals/template refuses by
        name. A write-scope key could therefore mint through here what it
        could not mint next door. Every template the plan would execute now
        passes the same gate as /journals/template, and the route moved to
        the admin group (alongside POST /dev/credits).


        A deployment that genuinely resolves deposit tolerance over HTTP opts
        the four codes into ALLOW_GENERIC_TEMPLATE_POST and calls this with
        an admin key. The library's own path is
        presets.BuildDepositTolerancePlan + ExecuteDepositTolerancePlan in
        the consumer's Go orchestration, with no HTTP-reachable key involved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositToleranceRequest" }
      responses:
        "201":
          description: Plan executed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositToleranceEnvelope" }
        "403":
          description: >-
            One of the templates the plan would execute is in the effective
            protected set -- the default answer for every caller until the
            codes are opted in via ALLOW_GENERIC_TEMPLATE_POST. Also returned
            when the key lacks the admin scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          $ref: "#/components/responses/DomainError"
  /journals/{uid}:
    get:
      x-required-scope: read
      tags: [Journals]
      summary: Get one journal with all its entries.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Journal + entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalWithEntriesEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
  /journals/{uid}/reverse:
    post:
      x-required-scope: write
      tags: [Journals]
      summary: Post the full reversal of an existing journal.
      description: >-
        Rejected (409) once the journal has any reversal history, full or
        partial — use reverse-partial to continue a partially-reversed journal.


        The idempotency key of a full reversal is derived server-side as
        `reversal:{uid}:{reason}`, so this endpoint takes none: supplying
        `idempotency_key` (in the body, or via the `Idempotency-Key` header,
        which the alias middleware folds into the body) is answered 400
        rather than accepted and ignored, which is what an earlier revision
        of this spec advertised as `required` (H-M3). Callers that need to
        choose the key use reverse-partial with `num` == `den` == 1.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                idempotency_key:
                  type: string
                  description: >-
                    Must be absent or empty. Present and non-empty is a 400 —
                    see this operation's description.
      responses:
        "201":
          description: Reversal posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already reversed.
  /journals/{uid}/reverse-partial:
    post:
      x-required-scope: write
      tags: [Journals]
      summary: Reverse num/den of a journal (partial reversal).
      description: >-
        Reverses num/den of every entry, per-currency balanced via
        largest-remainder allocation. Cumulative reversals never exceed the
        original (409 on overshoot). num == den ("1/1") reverses exactly the
        remaining un-reversed amount — the only way to complete a reversal
        whose earlier fractional steps rounded up.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [num, den, reason, idempotency_key]
              properties:
                num: { type: integer, format: int64, minimum: 1 }
                den: { type: integer, format: int64, minimum: 1 }
                reason: { type: string }
                idempotency_key: { type: string }
      responses:
        "201":
          description: Partial reversal posted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Cumulative reversal would exceed the original. }
        "422": { $ref: "#/components/responses/DomainError" }

  /entries:
    get:
      x-required-scope: read
      tags: [Journals]
      summary: List entries on one account dimension (cursor-paginated, newest first).
      description: >-
        Ordered newest first, the same direction as GET /journals: an
        account's entry list is a statement, and two reads a consumer pages
        side by side must not start from opposite ends.
      parameters:
        - in: query
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Entries page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryListEnvelope" }

  /balances/{holder}:
    get:
      x-required-scope: read
      tags: [Balances]
      summary: All of one holder's balances in one currency.
      description: >-
        One Balance per classification the holder has touched in
        `currency_uid`. `currency_uid` is required -- there is no
        across-currencies form of this endpoint (an earlier revision of this
        spec said there was, while the handler answered 400; H-M1).
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: currency_uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Balances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalancesEnvelope" }
  /balances/{holder}/{currency}:
    get:
      x-required-scope: read
      tags: [Balances]
      summary: Balances for one holder × currency.
      description: >-
        Per-classification breakdown for one currency, with the sum across
        classifications as `total` -- a different shape from GET
        /balances/{holder} (which lists one Balance per currency, no
        cross-classification sum), so it has its own envelope
        (BalanceByCurrencyEnvelope) rather than reusing BalancesEnvelope.
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: currency
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Per-classification balances for this holder × currency, plus their total.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceByCurrencyEnvelope" }
  /balances/{holder}/{currency}/breakdown:
    get:
      x-required-scope: read
      tags: [Balances]
      summary: Holder-facing liquidity view (available / pending / locked / total).
      description: >
        Aggregates the holder's classification balances by balance_role and
        layers reservation holds on top: available = Σ role=available − held,
        locked = Σ role=locked + held, pending = Σ role=pending,
        total = available + locked + pending. Reserve enforces its
        availability check against the same available figure.
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: currency
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Balance breakdown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceBreakdownEnvelope" }
  /balances/batch:
    post:
      x-required-scope: read
      tags: [Balances]
      summary: Batch balance lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holder_ids, currency_uid]
              properties:
                holder_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  maxItems: 100
                currency_uid: { type: string, format: uuid }
      responses:
        "200":
          description: >-
            List of holder → balances (server/handler_balances.go's
            handleBatchBalances returns a function-local `holderBalances`
            struct, not a named package-level type -- inline here rather
            than a $ref'd component, same reasoning as the requestBody
            schemas this suite deliberately leaves unregistered).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [list, next_cursor]
                        properties:
                          list:
                            type: array
                            items:
                              type: object
                              required: [holder_id, balances]
                              properties:
                                holder_id: { type: integer, format: int64 }
                                balances:
                                  type: array
                                  items: { $ref: "#/components/schemas/Balance" }
                          next_cursor:
                            type: [string, "null"]
                            description: Always null -- this endpoint returns its full result set (not paginated).

  /reservations:
    get:
      x-required-scope: read
      tags: [Reservations]
      summary: List reservations (cursor-paginated, newest first).
      description: Ordered by internal id descending, like the ledger reads.
      parameters:
        - in: query
          name: holder
          schema: { type: integer, format: int64 }
        - in: query
          name: status
          schema: { type: string, enum: [active, settling, settled, released] }
        - in: query
          name: cursor
          schema: { type: string, description: "Opaque page cursor from next_cursor" }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Reservations page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationListEnvelope" }
    post:
      x-required-scope: write
      tags: [Reservations]
      summary: Reserve funds (TOCTOU-safe).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveInput" }
      responses:
        "201":
          description: Reservation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEnvelope" }
        "422":
          $ref: "#/components/responses/DomainError"
  /reservations/{uid}/settle:
    post:
      x-required-scope: write
      tags: [Reservations]
      summary: Settle reservation with actual amount; remainder auto-released.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_amount, idempotency_key]
              properties:
                actual_amount: { type: string, description: Decimal as string. }
                idempotency_key:
                  type: string
                  description: >-
                    Required (I-3). Settled is a terminal status, so a retried
                    request replays idempotently instead of returning
                    ErrInvalidTransition: same key + same amount returns the
                    original success, same key + different amount is a
                    conflict.
      responses:
        "200":
          description: Settled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [settled] }
        "422": { $ref: "#/components/responses/DomainError" }
  /reservations/{uid}/settle-partial:
    post:
      x-required-scope: write
      tags: [Reservations]
      summary: Settle part of a reservation; call repeatedly to accumulate.
      description: >-
        First call transitions active → settling. Cumulative settled amount
        may never exceed the reserved amount. The unsettled remainder stays
        held against the balance until finalize. Finish with
        /reservations/{uid}/finalize.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, idempotency_key]
              properties:
                amount: { type: string, description: Decimal as string. }
                idempotency_key:
                  type: string
                  description: >-
                    Required (I-3). SettlePartial accumulates, so a retried
                    request replays idempotently instead of double-applying:
                    same key + same amount succeeds without effect, same key +
                    different amount is a conflict.
      responses:
        "200":
          description: Partial settlement recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [settling] }
        "422": { $ref: "#/components/responses/DomainError" }
  /reservations/{uid}/finalize:
    post:
      x-required-scope: write
      tags: [Reservations]
      summary: Finish a partially-settled reservation (settling → settled).
      description: Releases the unsettled remainder. Rejected on a reservation with no partial settlements.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
                  description: >-
                    Required (I-3). Settled is a terminal status, so a retried
                    request replays idempotently instead of returning
                    ErrInvalidTransition: same key returns the original
                    success, same key against a different reservation is a
                    conflict.
      responses:
        "200":
          description: Finalized.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [settled] }
        "422": { $ref: "#/components/responses/DomainError" }
  /reservations/{uid}/release:
    post:
      x-required-scope: write
      tags: [Reservations]
      summary: Release a reservation without settling.
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key:
                  type: string
                  description: >-
                    Required (I-3). Released is a terminal status, so a
                    retried request replays idempotently instead of returning
                    ErrInvalidTransition: same key returns the original
                    success, same key against a different reservation is a
                    conflict.
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, enum: [released] }
        "422": { $ref: "#/components/responses/DomainError" }

  /accounts/{holder}/policy:
    put:
      x-required-scope: admin
      tags: [Accounts]
      summary: Set (create or update) the freeze/close + balance-floor policy for an account dimension.
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPolicyInput" }
      responses:
        "200":
          description: Policy set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPolicyEnvelope" }
        "422": { $ref: "#/components/responses/DomainError" }
  /accounts/{holder}/policies:
    get:
      x-required-scope: read
      tags: [Accounts]
      summary: List every policy row for an account holder (across currencies/classifications).
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Policies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPolicyListEnvelope" }

  /holders/{holder}/deposit-address:
    post:
      x-required-scope: write
      tags: [Crypto Deposit]
      summary: Issue (idempotently) a holder's CREATE2 custody deposit address.
      description: >-
        Derives and registers the address on first call; repeated calls for
        the same holder always return the same address. Answers
        FeatureNotEnabled (503) unless the crypto-deposit add-on is wired in
        (see docs/plans/2026-07-11-crypto-deposit-sweep-design.md).
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "201":
          description: Deposit address (created on first call, or already registered).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddressEnvelope" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }
    get:
      x-required-scope: read
      tags: [Crypto Deposit]
      summary: Look up a holder's already-registered deposit address.
      description: Does not create one -- 404s if the holder has none yet.
      parameters:
        - in: path
          name: holder
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Deposit address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositAddressEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }

  /deposits/reviews:
    get:
      x-required-scope: read
      tags: [Crypto Deposit]
      summary: List deposit bookings parked in human review (M3 compensating controls).
      description: >-
        The `review` status is itself the review queue -- a deposit lands
        here when it exceeds the configured auto-credit ceiling or its
