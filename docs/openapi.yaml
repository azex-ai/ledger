        channel_name: { type: string }
        channel_ref:  { type: string }
        reservation_uid: { type: string, format: uuid, description: "Empty when no reservation linked." }
        journal_uid:    { type: string, format: uuid, description: "Empty when no journal linked." }
        idempotency_key: { type: string }
        metadata:
          type: object
          description: Free-form string tags; values are strings, never nested JSON.
          additionalProperties: { type: string }
        expires_at:
          description: >-
            Null when the booking has no expiry (the ordinary case for a
            booking created without one). Always present as a key; never an
            empty string, which is what an earlier revision emitted (H-M2).
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Timestamp"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
