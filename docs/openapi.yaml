        - in: path
          name: uid
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The booking the replayed sighting resolved to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingEnvelope" }
        "400": { $ref: "#/components/responses/DomainError" }
        "404": { $ref: "#/components/responses/DomainError" }
        "503": { description: Crypto-deposit add-on not enabled on this server. }
