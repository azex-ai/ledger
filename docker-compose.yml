# Local development database.
#
# This repository is a Go library. It ships no server to run, so this file
# only provides the PostgreSQL a consumer's own binary — or this repo's
# examples — can point at. The integration tests do not use it: they start
# their own container through testcontainers.
services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Resource templates (uncomment to enforce):
    # mem_limit: 512m
    # cpus: '1.0'

volumes:
  pgdata:
